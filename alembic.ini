# Konfiguracja migracji (instrukcja: alembic/README). Adres bazy ustawia
# alembic/env.py z DATABASE_URL backendu (src/backend/database.py).

[alembic]
script_location = %(here)s/alembic
# katalog glowny repo na sys.path - env.py importuje src.backend.*
prepend_sys_path = .
path_separator = os
# nadpisywane w alembic/env.py
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
