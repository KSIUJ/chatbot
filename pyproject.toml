[tool.pytest.ini_options]
# Testy importuja z katalogu glownego repo ("src.backend.*", "src.scrapers.*").
pythonpath = ["."]
testpaths = ["tests"]

[tool.alembic]
# Migracje bazy aplikacji (python -m alembic upgrade head z katalogu glownego).
# Adres bazy i logi ustawia src/backend/migrations/env.py (DATABASE_URL backendu).
script_location = "%(here)s/src/backend/migrations"
# katalog glowny repo na sys.path - env.py importuje src.backend.*
prepend_sys_path = ["."]

# Zaleznosci Pythona (PEP 735), instalacja: pip install --group <grupa> (pip >= 25.1).
#   app - backend; obraz Dockera: pip install --group app -c deploy/constraints.txt
#   dev - app + testy + scrapery; lokalnie: pnpm setup:backend
# Wersje przypiete, a deploy/constraints.txt przypina takze zaleznosci posrednie
# obrazu - przebudowa nie pobierze nowych wydan sama. Aktualizacja: zmien wersje
# tutaj, zbuduj obraz i odswiez constraints:
#   docker compose run --rm --no-deps -T backend pip freeze > deploy/constraints.txt
[dependency-groups]
app = [
    "requests==2.34.2",
    "python-dotenv==1.2.4",
    # Backend API (src/backend/main.py)
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    # Data w prompcie systemowym (src/backend/llm/dates.py): strefa Europe/Warsaw
    # takze na Windows i w obrazie slim (bez systemowej bazy stref czasowych)
    "tzdata==2026.5",
    # Claude API (src/backend/llm/claude_client.py) - opcjonalny dostawca LLM,
    # LLM_PROVIDER=claude. Cursor (LLM_PROVIDER=cursor) uzywa samego requests.
    "anthropic==1.13.0",
    # RAG retrieval i indeks (src/backend/rag/, CLI indeksu uruchamiane takze
    # w kontenerze backendu)
    "sentence-transformers==6.1.0",
    "chromadb==1.5.9",
    "langchain-text-splitters==1.1.3",
    "sqlalchemy==2.1.4",
    "alembic==1.20.0",
    "pymupdf4llm==1.28.2",
    # Logowanie OIDC przez Keycloak KSI (src/backend/auth/) - klient HTTP,
    # walidacja podpisanych ID tokenow (JWKS) i szyfrowanie tokenow w bazie
    "httpx==0.28.1",
    "joserfc==1.7.5",
    "cryptography==50.0.2",
    # Polaczenie kont z USOS (src/backend/usos/) - podpisy OAuth 1.0a HMAC-SHA1
    "oauthlib==4.0.0",
    # Naglowki notatek o KSI (src/backend/rag/sources/ksi/notes.py)
    "pyyaml==6.0.3",
]
dev = [
    { include-group = "app" },
    "pytest==9.2.0",
    # scrapery (src/scrapers): HTML z sieci parsuje lxml, OAuth1 do USOS API
    "beautifulsoup4==4.15.0",
    "soupsieve==3.0.1",
    "lxml==6.1.3",
    "requests-oauthlib==2.0.0",
    "pypdf==7.1.0",
    "python-docx==1.2.0",
]
