# wbudowany DNS Dockera - zmienna w proxy_pass ponizej wymusza rozwiazywanie
# nazwy "backend" leniwie (per-request), zamiast raz przy starcie nginksa.
# Bez tego nginx odmawia startu, jesli kontener backendu jeszcze nie istnieje
# w sieci compose (kolejnosc/restart kontenerow).
resolver 127.0.0.11 valid=30s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api/chat -> http://backend:8000/chat. Z $backend_upstream jako zmienna
    # (potrzebna do leniwego DNS, patrz resolver wyzej) nginx NIE obcina juz
    # sam prefiksu /api - trzeba to zrobic rewrite'em przed proxy_pass, inaczej
    # trafia do backendu jako /api/chat i dostaje 404. Dzieki temu frontend
    # zawsze woła wlasny origin - zero CORS, zero zaszytego adresu backendu.
    location /api/ {
        # kolejnosc ma znaczenie: "break" konczy faze rewrite, wiec "set" PO
        # nim nigdy by sie nie wykonal ("uninitialized variable" -> 500).
        set $backend_upstream http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # generowanie odpowiedzi LLM potrafi trwac dlugo
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
