# wbudowany DNS Dockera - zmienna w proxy_pass ponizej wymusza rozwiazywanie
# nazwy "backend" leniwie (per-request), zamiast raz przy starcie nginksa.
# Bez tego nginx odmawia startu, jesli kontener backendu jeszcze nie istnieje
# w sieci compose (kolejnosc/restart kontenerow).
resolver 127.0.0.11 valid=30s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api/chat -> http://backend:8000/chat (przecinajacy slash w proxy_pass
    # obcina prefiks /api). Dzieki temu frontend zawsze woła wlasny origin -
    # zero CORS, zero zaszytego adresu backendu.
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # generowanie odpowiedzi LLM potrafi trwac dlugo
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
