# Docker's embedded DNS - the variable in proxy_pass below makes nginx resolve
# "backend" lazily (per request) instead of once at startup. Without it nginx
# refuses to start when the backend container is not on the compose network
# yet (container order / restarts).
resolver 127.0.0.11 valid=30s;

# Cache-Control by the original request path ($uri changes after the /api
# rewrite and the SPA fallback). Without it browsers cache index.html
# heuristically - for days - and keep showing the old app after a deploy.
# Vite puts a content hash in every /assets/ file name, so those never change.
# Empty value = no header: /api responses keep whatever the backend sends.
map $request_uri $cache_control {
    ~^/api/     "";
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers for every response (pages and /api). The app loads
    # scripts, styles and images only from its own origin; the KSI login is a
    # top-level navigation, which CSP does not restrict. HSTS belongs to the
    # TLS-terminating reverse proxy in front of this container.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # here and not in a location: an add_header there would drop all of the above
    add_header Cache-Control $cache_control always;

    # /api/chat -> http://backend:8000/chat. With a variable in proxy_pass
    # (needed for the lazy DNS above) nginx no longer strips the /api prefix
    # itself, so the rewrite does it - otherwise the backend gets /api/chat and
    # answers 404. The frontend always calls its own origin: no CORS and no
    # backend address baked into the build.
    location /api/ {
        # order matters: "break" ends the rewrite phase, so a "set" after it
        # would never run ("uninitialized variable" -> 500)
        set $backend_upstream http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # generating an LLM answer can take a while
        proxy_read_timeout 300s;
        # The backend sends "X-Accel-Buffering: no" with /chat/stream. nginx
        # honours it but by default does not pass X-Accel-* on, so the reverse
        # proxy in front (also nginx on the KSI VM) would buffer the stream and
        # the answer would show up all at once.
        proxy_pass_header X-Accel-Buffering;
    }

    # File uploads (raw body). Same proxying as /api/ above, but a larger body
    # limit (nginx default: 1 MB). The backend enforces the real per-file limit
    # from the admin panel (max 50 MB), so this only has to be above it.
    location = /api/attachments {
        client_max_body_size 51m;
        set $backend_upstream http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # stream the body to the backend, which rejects too large files early
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
