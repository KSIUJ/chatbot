services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Jednorazowa "ollama pull" zanim backend wystartuje - inaczej pierwszy
  # /chat trafiaby w model, ktorego jeszcze nie ma (kilka GB pobierania).
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      - "ollama pull ${OLLAMA_MODEL:-qwen2.5:14b}"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/db/chatbot.db
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b}
      FRONTEND_ORIGINS: http://localhost:${FRONTEND_PORT:-8080}
    volumes:
      - chatbot-db:/app/db
      - chatbot-dataset:/app/dataset
      - chatbot-data:/app/data
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  ollama-data:
  chatbot-db:
  chatbot-dataset:
  chatbot-data:
  hf-cache:
