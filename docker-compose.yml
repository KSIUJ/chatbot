services:
  # Lokalny model dla LLM_PROVIDER=ollama. Startuje tylko z profilem:
  #   docker compose --profile ollama up -d --build
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Jednorazowe pobranie modelu OLLAMA_MODEL do wolumenu ollama-data.
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      - "ollama pull ${OLLAMA_MODEL:-qwen2.5:14b}"

  backend:
    build: .
    restart: unless-stopped
    # Konfiguracja (logowanie OIDC, dostawca LLM) z .env - patrz .env.example.
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/db/chatbot.db
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - chatbot-db:/app/db
      - chatbot-dataset:/app/dataset
      - chatbot-data:/app/data
      # zalaczniki z czatu (ATTACHMENTS_DIR=uploads -> /app/uploads)
      - chatbot-uploads:/app/uploads
      - hf-cache:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build: ./src/frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"

volumes:
  ollama-data:
  chatbot-db:
  chatbot-dataset:
  chatbot-data:
  chatbot-uploads:
  hf-cache:
