# GPU (NVIDIA) dla Ollamy. Wymaga NVIDIA Container Toolkit na hoscie:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile ollama up -d --build
# Backend zostaje na CPU (obraz ma torch w wersji CPU).
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
